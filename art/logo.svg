<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="70" y1="300" x2="300" y2="110">
      <stop offset="0" stop-color="#4A2A7A" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#5A3196" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7A45D0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="trailCore" gradientUnits="userSpaceOnUse" x1="120" y1="258" x2="300" y2="110">
      <stop offset="0" stop-color="#C9A0FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#D9BEFF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="110" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A6AE0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9A6AE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="292" cy="104" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A1D5E"/>
      <stop offset="0.7" stop-color="#26123F"/>
      <stop offset="1" stop-color="#7A45D0"/>
    </radialGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A47BEA"/>
      <stop offset="1" stop-color="#6A3FB5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#15121D"/>

  <!-- bars -->
  <rect x="60" y="270" width="66" height="74" rx="8" fill="#3A3150"/>
  <rect x="150" y="225" width="66" height="119" rx="8" fill="#5A3D96"/>
  <rect x="240" y="175" width="66" height="169" rx="8" fill="url(#bar3)"/>
  <rect x="44" y="340" width="312" height="8" rx="4" fill="#2A2438"/>

  <!-- trail -->
  <polygon points="70,300 274.5,79.1 325.5,140.9" fill="url(#trail)"/>
  <polygon points="120,258 287.2,94.6 312.8,125.4" fill="url(#trailCore)" opacity="0.7"/>
  <path d="M96 262 Q170 200 270 96" fill="none" stroke="url(#trailCore)" stroke-width="4" stroke-linecap="round"/>  <circle cx="186" cy="190" r="5" fill="#C9A0FF" opacity="0.75"/>
  <circle cx="222" cy="148" r="3.5" fill="#E6D4FF" opacity="0.8"/>
  <circle cx="142" cy="268" r="3.5" fill="#B393F0" opacity="0.55"/>
  <circle cx="250" cy="176" r="3" fill="#C9A0FF" opacity="0.6"/>

  <!-- bolt -->
  <circle cx="300" cy="110" r="78" fill="url(#glow)"/>
  <circle cx="300" cy="110" r="44" fill="url(#orb)"/>
  <circle cx="300" cy="110" r="44" fill="none" stroke="#C9A0FF" stroke-width="3" opacity="0.85"/>
  <g>
    <path d="M300 110 C288 80 322 62 343 88 C318 76 300 90 311 110 Z" fill="#E6D4FF"/>
    <path d="M300 110 C288 80 322 62 343 88 C318 76 300 90 311 110 Z" fill="#B393F0" transform="rotate(120 300 110)"/>
    <path d="M300 110 C288 80 322 62 343 88 C318 76 300 90 311 110 Z" fill="#9A6AE0" transform="rotate(240 300 110)"/>
  </g>
  <circle cx="300" cy="110" r="9" fill="#1A0B2E"/>
  <circle cx="282" cy="88" r="4" fill="#F5ECFF"/>
</svg>
